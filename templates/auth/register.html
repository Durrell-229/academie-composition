{% extends 'base.html' %}
{% block content_empty %}
<div class="max-w-xl mx-auto glass p-10 rounded-3xl" x-data="{ role: 'eleve' }">
    <h1 class="text-3xl font-bold mb-8 text-center text-white">Créer un compte</h1>

    <!-- Google OAuth Button -->
    <a href="{% url 'google_login' %}" class="w-full flex items-center justify-center gap-3 px-6 py-4 rounded-2xl bg-white text-gray-900 font-bold text-sm border-2 border-gray-200 hover:bg-gray-50 hover:border-gray-300 hover:shadow-lg active:scale-[0.98] transition-all shadow-md mb-6">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        S'inscrire avec Google
    </a>

    <div class="flex items-center gap-4 mb-6">
        <div class="flex-1 h-px bg-border-standard"></div>
        <span class="text-xs font-bold uppercase tracking-widest" style="color: #94A3B8;">ou</span>
        <div class="flex-1 h-px bg-border-standard"></div>
    </div>

    <form method="POST" class="space-y-6">
        {% csrf_token %}
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-text-muted mb-2">Prénom *</label>
                <input type="text" name="first_name" class="w-full bg-bg-secondary border border-border-standard rounded-xl p-3 focus:ring-2 focus:ring-primary" style="color: #F1F5F9;" required>
            </div>
            <div>
                <label class="block text-sm text-text-muted mb-2">Nom *</label>
                <input type="text" name="last_name" class="w-full bg-bg-secondary border border-border-standard rounded-xl p-3 focus:ring-2 focus:ring-primary" style="color: #F1F5F9;" required>
            </div>
        </div>
        
        <div>
            <label class="block text-sm text-text-muted mb-2">Email *</label>
            <input type="email" name="email" class="w-full bg-bg-secondary border border-border-standard rounded-xl p-3 focus:ring-2 focus:ring-primary" style="color: #F1F5F9;" required>
        </div>

        <div>
            <label class="block text-sm text-text-muted mb-2">Mot de passe *</label>
            <input type="password" name="password" class="w-full bg-bg-secondary border border-border-standard rounded-xl p-3 focus:ring-2 focus:ring-primary" style="color: #F1F5F9;" required>
        </div>

        <div>
            <label class="block text-sm text-text-muted mb-2">Rôle *</label>
            <select name="role" x-model="role" class="w-full bg-bg-secondary border border-border-standard rounded-xl p-3 focus:ring-2 focus:ring-primary" style="color: #F1F5F9; background-color: #1E293B;">
                <option value="eleve" style="color: #0F172A; background-color: #F1F5F9;">Élève</option>
                <option value="professeur" style="color: #0F172A; background-color: #F1F5F9;">Professeur</option>
                <option value="conseiller" style="color: #0F172A; background-color: #F1F5F9;">Conseiller Pédagogique</option>
                <option value="admin" style="color: #0F172A; background-color: #F1F5F9;">Administrateur</option>
            </select>
        </div>

        <div x-show="role !== 'eleve'" class="bg-primary/10 p-4 rounded-xl border border-primary/20">
            <label class="block text-sm text-primary mb-2 font-bold">Code d'accès au rôle *</label>
            <input type="password" name="role_password" placeholder="Code fourni par l'administration" class="w-full bg-bg-primary border border-border-standard rounded-xl p-3 focus:ring-2 focus:ring-primary" style="color: #F1F5F9;">
        </div>

        <!-- ═══ CHAMPS ÉLÈVE : CLASSE & SÉRIE ═══ -->
        <div x-show="role === 'eleve'" class="space-y-4 p-4 rounded-xl bg-bg-secondary/50 border border-border-standard">
            <h3 class="text-sm font-bold text-primary">Informations scolaires</h3>
            
            <div>
                <label class="block text-sm text-text-muted mb-2">Classe *</label>
                <select name="classe" class="w-full bg-bg-primary border border-border-standard rounded-xl p-3 focus:ring-2 focus:ring-primary" style="color: #F1F5F9; background-color: #1E293B;">
                    <option value="" style="color: #0F172A; background-color: #F1F5F9;">-- Choisir sa classe --</option>
                    {% for c in classes %}
                    <option value="{{ c.nom }}" style="color: #0F172A; background-color: #F1F5F9;">{{ c.nom }}</option>
                    {% endfor %}
                </select>
                <p class="text-xs text-text-muted mt-1">Ta classe apparaîtra sur tes bulletins</p>
            </div>

            <div>
                <label class="block text-sm text-text-muted mb-2">Série (si Terminale)</label>
                <select name="serie" class="w-full bg-bg-primary border border-border-standard rounded-xl p-3 focus:ring-2 focus:ring-primary" style="color: #F1F5F9; background-color: #1E293B;">
                    <option value="" style="color: #0F172A; background-color: #F1F5F9;">-- Choisir sa série (ou laisser vide) --</option>
                    <option value="A1" style="color: #0F172A; background-color: #F1F5F9;">A1 — Lettres Langues</option>
                    <option value="A2" style="color: #0F172A; background-color: #F1F5F9;">A2 — Lettres Sciences Humaines</option>
                    <option value="B" style="color: #0F172A; background-color: #F1F5F9;">B — Lettres Sciences Sociales</option>
                    <option value="C" style="color: #0F172A; background-color: #F1F5F9;">C — Sciences et Mathématiques</option>
                    <option value="D" style="color: #0F172A; background-color: #F1F5F9;">D — Biologie Géologie</option>
                    <option value="E" style="color: #0F172A; background-color: #F1F5F9;">E — Mathématiques et Techniques</option>
                    <option value="G1" style="color: #0F172A; background-color: #F1F5F9;">G1 — Techniques Administratives</option>
                    <option value="G2" style="color: #0F172A; background-color: #F1F5F9;">G2 — Techniques Quantitatives de Gestion</option>
                    <option value="G3" style="color: #0F172A; background-color: #F1F5F9;">G3 — Techniques Commerciales</option>
                </select>
                <p class="text-xs text-text-muted mt-1">La série est requise en Première/Terminale</p>
            </div>

            <div>
                <label class="block text-sm text-text-muted mb-2">Sexe</label>
                <select name="sexe" class="w-full bg-bg-primary border border-border-standard rounded-xl p-3 focus:ring-2 focus:ring-primary" style="color: #F1F5F9; background-color: #1E293B;">
                    <option value="" style="color: #0F172A; background-color: #F1F5F9;">-- Choisir --</option>
                    <option value="Masculin" style="color: #0F172A; background-color: #F1F5F9;">Masculin</option>
                    <option value="Féminin" style="color: #0F172A; background-color: #F1F5F9;">Féminin</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-text-muted mb-2">Matricule (si connu)</label>
                <input type="text" name="matricule" placeholder="Ex: ELE-2025-00001" class="w-full bg-bg-primary border border-border-standard rounded-xl p-3 focus:ring-2 focus:ring-primary" style="color: #F1F5F9;">
            </div>
        </div>

        <div>
            <label class="block text-sm text-text-muted mb-2">Téléphone</label>
            <input type="text" name="phone" class="w-full bg-bg-secondary border border-border-standard rounded-xl p-3 focus:ring-2 focus:ring-primary" style="color: #F1F5F9;">
        </div>

        <div>
            <label class="block text-sm text-text-muted mb-2">Pays</label>
            <select name="country" class="w-full bg-bg-secondary border border-border-standard rounded-xl p-3 focus:ring-2 focus:ring-primary" style="color: #F1F5F9; background-color: #1E293B;">
                <option value="Bénin" style="color: #0F172A; background-color: #F1F5F9;">🇧🇯 Bénin</option>
                <option value="France" style="color: #0F172A; background-color: #F1F5F9;">🇫🇷 France</option>
                <option value="Togo" style="color: #0F172A; background-color: #F1F5F9;">🇹🇬 Togo</option>
                <option value="Nigeria" style="color: #0F172A; background-color: #F1F5F9;">🇳🇬 Nigeria</option>
                <option value="Autre" style="color: #0F172A; background-color: #F1F5F9;">Autre</option>
            </select>
        </div>

        <button type="submit" class="w-full bg-button-gradient hover:opacity-90 py-4 rounded-xl font-bold text-white transition shadow-lg shadow-primary/20">
            Créer mon compte
        </button>
    </form>
    
    <p class="text-center text-sm text-text-muted mt-6">
        Déjà inscrit ? <a href="{% url 'login' %}" class="text-primary hover:underline font-bold">Se connecter</a>
    </p>
</div>
{% endblock %}
