<!-- Notification Bell Component with Real-time Updates -->
<div x-data="notificationBell()" class="relative">
    <!-- Bell Icon -->
    <button @click="showDropdown = !showDropdown" 
            class="relative p-2 text-text-secondary hover:text-white hover:bg-primary/50 rounded-lg transition">
        <i class="fa-solid fa-bell text-lg"></i>
        <!-- Unread Badge -->
        <span x-show="unreadCount > 0" 
              x-text="unreadCount > 99 ? '99+' : unreadCount"
              class="absolute -top-1 -right-1 bg-danger text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1 animate-pulse">
        </span>
    </button>

    <!-- Dropdown Panel -->
    <div x-show="showDropdown" 
         @click.away="showDropdown = false"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="absolute right-0 mt-2 w-96 bg-bg-card border border-border-standard rounded-2xl shadow-2xl z-50 overflow-hidden"
         style="display: none;">
        
        <!-- Header -->
        <div class="p-4 border-b border-border-standard bg-bg-secondary">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-sm">
                    <i class="fa-solid fa-bell text-primary mr-2"></i>
                    Notifications
                </h3>
                <span x-show="unreadCount > 0" class="text-xs text-primary font-bold">
                    <span x-text="unreadCount"></span> non lue(s)
                </span>
            </div>
        </div>

        <!-- Notifications List -->
        <div class="max-h-96 overflow-y-auto">
            <template x-if="notifications.length === 0">
                <div class="p-8 text-center text-text-muted">
                    <i class="fa-solid fa-bell-slash text-3xl mb-2"></i>
                    <p class="text-sm">Aucune notification</p>
                </div>
            </template>

            <template x-for="notif in notifications.slice(0, 10)" :key="notif.id">
                <div @click="markAsRead(notif.id)" 
                     class="p-4 border-b border-border-standard hover:bg-primary/5 cursor-pointer transition"
                     :class="{'bg-primary/5': !notif.is_read}">
                    <div class="flex items-start gap-3">
                        <!-- Icon based on type -->
                        <div class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center"
                             :class="{
                                 'bg-primary/10 text-primary': notif.type === 'INSCRIPTION',
                                 'bg-success/10 text-success': notif.type === 'BULLETIN',
                                 'bg-warning/10 text-warning': notif.type === 'APPROBATION'
                             }">
                            <i class="fa-solid text-sm"
                               :class="{
                                   'fa-user-plus': notif.type === 'INSCRIPTION',
                                   'fa-file-lines': notif.type === 'BULLETIN',
                                   'fa-check-circle': notif.type === 'APPROBATION'
                               }"></i>
                        </div>
                        
                        <!-- Content -->
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-bold text-text-primary truncate" x-text="notif.title"></p>
                            <p class="text-xs text-text-muted mt-1 line-clamp-2" x-text="notif.message"></p>
                            <p class="text-[10px] text-text-muted mt-1" x-text="formatTimeAgo(notif.created_at)"></p>
                        </div>

                        <!-- Unread indicator -->
                        <div x-show="!notif.is_read" class="flex-shrink-0 w-2 h-2 rounded-full bg-primary mt-2"></div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Footer -->
        <div class="p-3 border-t border-border-standard bg-bg-secondary">
            <div class="flex gap-2">
                <a href="{% url 'notification_list' %}" class="flex-1 text-center py-2 text-xs font-bold text-primary hover:bg-primary/10 rounded-lg transition">
                    Voir toutes les notifications
                </a>
                <button @click="markAllAsRead()" 
                        x-show="unreadCount > 0"
                        class="px-3 py-2 text-xs font-bold text-success hover:bg-success/10 rounded-lg transition">
                    Tout marquer comme lu
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function notificationBell() {
    return {
        showDropdown: false,
        unreadCount: 0,
        notifications: [],
        eventSource: null,

        init() {
            // Load initial notifications
            this.loadNotifications();
            
            // Connect to SSE stream for real-time updates
            this.connectSSE();
        },

        async loadNotifications() {
            try {
                // Get unread count
                const countResp = await fetch("{% url 'notification_unread_count' %}");
                const countData = await countResp.json();
                this.unreadCount = countData.unread_count;

                // Get recent notifications
                const listResp = await fetch("{% url 'notification_list' %}");
                if (listResp.ok) {
                    const html = await listResp.text();
                    // Parse notifications from page (we'll improve this with a proper API later)
                    // For now, just update the count
                }
            } catch (error) {
                console.error('Error loading notifications:', error);
            }
        },

        connectSSE() {
            // Connect to SSE stream
            this.eventSource = new EventSource("{% url 'notification_stream' %}");

            this.eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'new_notification') {
                        // Update unread count
                        this.unreadCount = data.unread_count;
                        
                        // Add notification to list
                        if (data.notification) {
                            this.notifications.unshift(data.notification);
                            
                            // Show browser notification if supported
                            this.showBrowserNotification(data.notification);
                        }
                    }
                } catch (error) {
                    console.error('Error parsing SSE data:', error);
                }
            };

            this.eventSource.onerror = (error) => {
                console.error('SSE connection error:', error);
                // Reconnect after 5 seconds
                setTimeout(() => {
                    this.connectSSE();
                }, 5000);
            };
        },

        async markAsRead(notificationId) {
            try {
                const resp = await fetch(`/notifications/mark-read/${notificationId}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': this.getCSRFToken(),
                        'Content-Type': 'application/json',
                    },
                });
                const data = await resp.json();
                
                if (data.success) {
                    this.unreadCount = data.unread_count;
                    // Update notification in list
                    const notif = this.notifications.find(n => n.id === notificationId);
                    if (notif) {
                        notif.is_read = true;
                    }
                }
            } catch (error) {
                console.error('Error marking notification as read:', error);
            }
        },

        async markAllAsRead() {
            try {
                const resp = await fetch("{% url 'notification_list' %}", {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': this.getCSRFToken(),
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'mark_all_read=1',
                });
                
                if (resp.ok) {
                    this.unreadCount = 0;
                    this.notifications.forEach(n => n.is_read = true);
                    window.location.reload();
                }
            } catch (error) {
                console.error('Error marking all as read:', error);
            }
        },

        showBrowserNotification(notif) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(notif.title, {
                    body: notif.message,
                    icon: '/static/icons/notification.png',
                });
            }
        },

        formatTimeAgo(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 60) return 'À l\'instant';
            if (seconds < 3600) return `${Math.floor(seconds / 60)} min`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)} h`;
            return date.toLocaleDateString('fr-FR');
        },

        getCSRFToken() {
            const cookie = document.cookie.split(';').find(c => c.trim().startsWith('csrftoken='));
            return cookie ? cookie.split('=')[1] : '';
        },

        destroy() {
            if (this.eventSource) {
                this.eventSource.close();
            }
        }
    };
}
</script>
