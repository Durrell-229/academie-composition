{% extends 'base.html' %}
{% block title %}{{ organisation.nom }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto mt-10 p-6 bg-slate-900 rounded-2xl border border-slate-700">
  <h1 class="text-xl font-bold text-white mb-2">{{ organisation.nom }}</h1>
  <p class="text-slate-400 text-sm mb-6">Code : {{ organisation.code }} &bull; {{ organisation.pays }}</p>
  <a href="{% url 'core:organisation_membres' organisation.pk %}" class="inline-block px-4 py-2 bg-primary text-white text-sm font-bold rounded-xl hover:opacity-90 transition">
    Voir les membres
  </a>
</div>
{% endblock %}
