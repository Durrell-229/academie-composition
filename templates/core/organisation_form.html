{% extends 'base.html' %}
{% block title %}Créer une organisation{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto mt-10 p-6 bg-slate-900 rounded-2xl border border-slate-700">
  <h1 class="text-xl font-bold text-white mb-6">Créer une organisation</h1>
  <form method="post">
    {% csrf_token %}
    <div class="mb-4">
      <label class="block text-sm text-slate-400 mb-1">Nom</label>
      <input name="nom" type="text" required class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white">
    </div>
    <div class="mb-4">
      <label class="block text-sm text-slate-400 mb-1">Code (unique)</label>
      <input name="code" type="text" required class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white">
    </div>
    <div class="mb-6">
      <label class="block text-sm text-slate-400 mb-1">Pays</label>
      <input name="pays" type="text" value="Bénin" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white">
    </div>
    <button type="submit" class="w-full py-2 bg-primary text-white font-bold rounded-xl hover:opacity-90 transition">Créer</button>
  </form>
</div>
{% endblock %}
