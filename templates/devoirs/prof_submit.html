{% extends 'base.html' %}
{% block title %}Soumettre Épreuve | {{ devoir.titre }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
  <h1 class="text-2xl font-black">Soumettre une Épreuve</h1>
  <p class="text-text-muted"><strong>Devoir :</strong> {{ devoir.titre }} — <strong>Matière :</strong> {{ matiere.nom }}</p>

  <form method="post" enctype="multipart/form-data" class="bg-bg-card rounded-2xl border border-border-standard p-6 space-y-5">
    {% csrf_token %}

    <div>
      <label class="block text-sm font-bold text-text-secondary mb-1">Fichier Épreuve (PDF) *</label>
      <input type="file" name="epreuve" accept=".pdf,.doc,.docx" required class="w-full bg-bg-card border border-border-standard rounded-xl px-4 py-3 text-text-primary">
    </div>

    <div>
      <label class="block text-sm font-bold text-text-secondary mb-1">Corrigé Type (PDF) *</label>
      <input type="file" name="corrige" accept=".pdf,.doc,.docx" required class="w-full bg-bg-card border border-border-standard rounded-xl px-4 py-3 text-text-primary">
    </div>

    <div class="flex justify-end gap-3">
      <a href="{% url 'dashboard' %}" class="px-6 py-3 rounded-xl bg-bg-tertiary border border-border-standard text-sm font-bold text-text-muted">Annuler</a>
      <button type="submit" class="px-8 py-3 rounded-xl bg-primary text-white text-sm font-black shadow-lg hover:bg-primary/80 transition flex items-center gap-2">
        <i class="fa-solid fa-upload"></i> Soumettre
      </button>
    </div>
  </form>
</div>
{% endblock %}
